name: Fanarts checks
on:
  pull_request:
    paths:
      - 'fanarts*'
      - 'header-scroll.js'
      - 'header-account.js'
      - 'header-notifications.js'
      - 'header-notifications.css'
      - 'reader.js'
      - 'community-panel.js'
      - 'community-notifications.js'
      - 'community-staff-appeals.js'
      - 'moderation-hierarchy.js'
      - 'community-mentions.js'
      - 'community-social.css'
      - 'moderacao.html'
      - 'moderation-fanart-comments.js'
      - 'moderation-fanart-reports.js'
      - 'moderation-edit-history.js'
      - 'moderation-featured-fanarts.js'
      - 'supabase/migrations/*fanart*'
      - 'supabase/migrations/*community*'
      - 'supabase/migrations/*staff*'
      - 'supabase/migrations/*moderation_recent*'
      - 'tests/fanarts*'
      - 'tests/community-social*'
      - 'tests/staff-hierarchy*'
      - 'tests/header-navigation*'
      - '.github/workflows/fanarts-checks.yml'
  workflow_dispatch:
jobs:
  fanarts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check fanarts-gallery.js
          node --check fanarts-detail.js
          node --check fanarts-submit.js
          node --check fanarts-spoilers.js
          node --check fanarts-reports.js
          node --check fanarts-featured.js
          node --check fanarts-my-submissions.js
          node --check community-panel.js
          node --check community-notifications.js
          node --check community-staff-appeals.js
          node --check moderation-hierarchy.js
          node --check header-notifications.js
          node --check header-account.js
          node --check community-mentions.js
          node --check moderation-fanart-comments.js
          node --check moderation-fanart-reports.js
          node --check moderation-edit-history.js
          node --check moderation-featured-fanarts.js
          node --check reader.js
          node --check header-scroll.js
      - name: Run focused fanart and community tests
        run: node --test tests/staff-hierarchy.test.mjs tests/community-social.test.mjs tests/fanarts-subpages.test.mjs tests/fanarts-enhancements.test.mjs tests/fanarts-spoiler-behavior.test.mjs tests/fanarts-moderation.test.mjs tests/header-navigation.test.mjs tests/fanarts-publication.test.mjs
